<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cronograma — PROMOVILIDAD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* Estilo Google Material (Workspace) — ver GUIA_ESTILO_GOOGLE.md
       Se conservan todos los nombres de clases y variables que usa el JS.
       Las medidas que el JS usa para alinear filas (alto de fila 32/36 px,
       cabecera 2 × 28 px) no se tocan. */
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Tokens de la guía */
      --surface: #ffffff;
      --line: #dadce0;
      --line-soft: #e8eaed;
      --text-2: #5f6368;
      --text-3: #80868b;
      --primary: #1a73e8;
      --primary-hover: #1765cc;
      --primary-soft: #e8f0fe;
      --primary-ink: #1967d2;
      --hover: #f1f3f4;
      --shadow-1: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
      --shadow-2: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);

      /* Variables antiguas (las usan los estilos en línea del HTML/JS) → paleta Google */
      --bg: #f8f9fa;
      --white: #ffffff;
      --border: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --accent: #1a73e8;
      --signal: #1e8e3e;
      --amber: #e37400;   /* ámbar legible para texto/íconos; la barra usa #f9ab00 */
      --red: #d93025;
      --blue: #1a73e8;
    }
    body {
      font-family: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
      /* Columna: barra superior + herramientas + área del cronograma que ocupa el resto */
      height: 100vh; display: flex; flex-direction: column;
    }
    button, input, select { font: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* HEADER (barra superior, como reportes.html) */
    .header {
      background: var(--bg);
      border-bottom: 1px solid var(--line-soft);
      padding: 10px 24px;
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo { display: flex; align-items: center; }
    .header-logo img { height: 30px; width: auto; display: block; object-fit: contain; }
    .header-title { font-size: 22px; font-weight: 400; color: var(--text); line-height: 1.25; letter-spacing: -.1px; white-space: nowrap; }
    .header-sep { width: 1px; height: 28px; background: var(--line); }
    .header-docs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 16px 0 12px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line);
      color: var(--primary-ink); font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background .15s, border-color .15s; text-decoration: none; white-space: nowrap;
    }
    .btn-back i { font-size: 13px; }
    .btn-back:hover { background: #f6fafe; border-color: #c6dafc; }

    /* BARRA DE HERRAMIENTAS (filtros, vista, zoom, navegación) */
    .toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 12px 24px; flex-shrink: 0;
    }
    select {
      height: 36px; padding: 0 10px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--surface);
      color: var(--text); font-family: inherit; font-size: 13px; font-weight: 400;
      cursor: pointer; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    select:hover { border-color: #bdc1c6; }
    select:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    /* Botón outlined en píldora */
    .btn-ctrl {
      display: inline-flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 16px 0 14px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface);
      color: var(--primary-ink); font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; outline: none; white-space: nowrap;
      transition: background .15s, border-color .15s, color .15s;
    }
    .btn-ctrl i { font-size: 13px; }
    .btn-ctrl:hover { background: #f6fafe; border-color: #c6dafc; }
    .btn-ctrl:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    /* Activo = tonal */
    .btn-ctrl.active { background: var(--primary-soft); border-color: transparent; color: var(--primary-ink); }
    body.ejes-ocultos .eje-panel { display: none; }
    .btn-ctrl.active:hover { background: #d2e3fc; }
    /* Grupo de botones de ícono dentro de un contorno en píldora */
    .zoom-group {
      display: inline-flex; align-items: center; gap: 2px;
      height: 36px; padding: 0 3px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface);
    }
    .zoom-btn {
      width: 30px; height: 30px; border-radius: 999px;
      border: none; background: transparent;
      color: var(--text-2); font-size: 13px; font-weight: 500;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s; white-space: nowrap;
    }
    .zoom-btn:hover { background: rgba(60,64,67,.08); color: var(--text); }
    .zoom-val { font-size: 13px; font-weight: 500; color: var(--text-2); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
    .spacer { flex: 1; }

    /* LEYENDA (franja superior de la tarjeta) */
    .legend {
      display: flex; align-items: center; gap: 6px 18px; padding: 10px 16px;
      background: var(--surface); border-bottom: 1px solid var(--line-soft);
      flex-wrap: wrap; flex-shrink: 0;
    }
    .leg-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
    .leg-item i { font-size: 12px; }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* LAYOUT */
    .gantt-wrap { display: flex; flex: 1; min-height: 0; gap: 12px; padding: 0 24px 16px 12px; overflow: hidden; }

    /* PANEL IZQUIERDO — lista de ejes (como navegación lateral) */
    .eje-panel {
      width: 200px; flex-shrink: 0;
      background: transparent;
      overflow-y: auto;
      padding: 4px 0 8px;
    }
    .eje-panel-title {
      font-size: 12px; font-weight: 500; color: var(--text-2);
      padding: 4px 16px 8px;
    }
    .eje-item {
      padding: 9px 16px; border-radius: 16px; cursor: pointer;
      font-size: 13.5px; font-weight: 500; color: var(--text);
      transition: background .15s, color .15s; margin-bottom: 2px;
      line-height: 1.35;
    }
    .eje-item:hover { background: rgba(60,64,67,.08); }
    .eje-item.active { background: var(--primary-soft); color: var(--primary-ink); }
    .eje-pct { font-size: 12px; font-weight: 400; margin-top: 2px; font-variant-numeric: tabular-nums; }

    /* GANTT AREA — tarjeta blanca con la leyenda y los dos paneles */
    .gantt-area {
      flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    }
    .gantt-body  { flex: 1; min-height: 0; display: flex; overflow: hidden; }

    /* Panel de labels — ancho fijo, nunca crece */
    .label-panel {
      width: 340px; min-width: 340px; max-width: 340px; flex-shrink: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      background: var(--surface);
    }
    .label-header {
      height: 56px; min-height: 56px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center;
      padding: 0 16px;
      font-size: 12px; font-weight: 500; color: var(--text-2);
      flex-shrink: 0;
    }
    .label-rows { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
    .label-rows::-webkit-scrollbar { display: none; }
    .label-table {
      border-collapse: collapse; width: 100%; table-layout: fixed;
    }
    .label-cell {
      width: 340px; min-width: 340px; max-width: 340px;
      padding: 0 12px 0 16px;
      font-size: 12.5px; line-height: 1.3; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      border-bottom: 1px solid var(--line-soft);
      background: var(--surface);
      vertical-align: middle;
    }
    .label-cell.group-row {
      background: var(--bg);
      font-size: 13px; font-weight: 500; color: var(--text);
      border-bottom: 1px solid var(--line-soft);
      padding-left: 16px;
    }
    .label-cell.task-row { color: var(--text); font-weight: 400; padding-left: 28px; cursor: pointer; transition: background .15s, color .15s; }
    .label-cell.task-row:hover { background: #f6fafe; color: var(--primary-ink); }
    .label-cell.group-row:hover { background: var(--hover); }

    /* Panel del gantt — scroll horizontal invisible */
    .gantt-scroll-wrap { flex: 1; overflow-x: auto; overflow-y: auto; position: relative; }
    .gantt-scroll-wrap::-webkit-scrollbar { height: 0px; width: 0px; }
    .gantt-scroll-wrap { scrollbar-width: none; }

    /* GANTT GRID — solo datos, sin columna de labels */
    .ganttGrid {
      border-collapse: collapse;
      font-size: 12px; line-height: 1.3;
      table-layout: fixed;
    }
    .ganttGrid td, .ganttGrid th { padding: 0; border: none; }
    .ganttMonth {
      background: var(--bg);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line-soft);
      padding: 0 10px;
      font-size: 12px; font-weight: 500; color: var(--text);
      overflow: hidden; white-space: nowrap;
      text-align: left; vertical-align: middle;
      position: sticky; top: 0; z-index: 15;
    }
    .ganttTick {
      background: var(--bg);
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line);
      padding: 0 2px;
      font-size: 11px; font-weight: 400; color: var(--text-2);
      text-align: center; overflow: hidden; white-space: nowrap;
      font-variant-numeric: tabular-nums;
      position: sticky; top: 28px; z-index: 15;
    }
    .gantt-cell { border-bottom: 1px solid var(--line-soft); border-right: 1px solid #f1f3f4; position: relative; overflow: visible; }
    .gantt-cell.group-row { background: var(--bg); border-bottom: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); }
    .gantt-cell.weekend { background: rgba(60,64,67,0.05); }
    .gantt-cell.alt-month { background: rgba(60,64,67,0.025); }
    .gantt-cell.weekend.alt-month { background: rgba(60,64,67,0.07); }
    .ganttToday {
      display: none; /* reemplazado por overlay global */
    }
    .today-overlay {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: var(--red); opacity: .7; pointer-events: none;
      z-index: 20; will-change: transform;
    }
    .today-overlay::after {
      content: "Hoy"; position: absolute; top: 6px; left: 4px;
      padding: 0 5px; border-radius: 4px; line-height: 16px;
      background: var(--red); color: #fff;
      font-size: 10px; font-weight: 500; white-space: nowrap;
    }
    .gbar-wrap { position: relative; width: 100%; height: 100%; overflow: visible; z-index: 2; }
    .gbar {
      position: absolute; top: 50%; transform: translateY(-50%);
      height: 22px; border-radius: 6px;
      display: flex; align-items: center; padding: 0 8px;
      font-size: 11px; font-weight: 500; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; transition: filter .15s, box-shadow .15s;
    }
    .gbar:hover { filter: brightness(1.06); }
    .gbar.hito-mode {
      height: 20px; border-radius: 6px;
    }
    .ganttLegend { display: none; }

    /* ESTADO COLORES (sólidos, paleta Google) */
    .bar-done    { background: #1e8e3e; }
    .bar-process { background: #1a73e8; }
    .bar-pending { background: #f9ab00; color: #202124; }  /* texto oscuro: el blanco no se lee sobre ámbar */
    .bar-blocked { background: #d93025; }

    /* EMPTY */
    .empty-gantt {
      display: flex; align-items: center; justify-content: center;
      height: 200px; color: var(--text-2); font-size: 14px;
    }

    /* RESPONSIVE (móvil): ejes en fila de chips y columna de actividades más angosta */
    @media (max-width: 760px) {
      .header { padding: 10px 16px; gap: 10px; }
      .header-title { font-size: 19px; }
      .header-sep { display: none; }
      .toolbar { padding: 10px 16px; }
      .gantt-wrap { flex-direction: column; flex: 1 0 auto; padding: 0 16px 16px; gap: 8px; }
      .eje-panel { width: auto; overflow-x: auto; overflow-y: hidden; padding: 0 0 4px; }
      .eje-panel-title { padding: 0 4px 6px; }
      #ejeList { display: flex; gap: 8px; }
      .eje-item { flex-shrink: 0; max-width: 240px; margin: 0; border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; }
      .eje-item.active { border-color: transparent; }
      .gantt-area { min-height: 480px; }
      .label-panel { width: 150px; min-width: 150px; max-width: 150px; }
      .label-cell { width: 150px; min-width: 150px; max-width: 150px; padding-right: 8px; }
      .label-cell.task-row { padding-left: 16px; }
    }
  </style>
</head>
<body style="opacity:0">
<style>
  #appLoaderGantt {
    position:fixed;inset:0;z-index:9999;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;

</div>

    <a id="btnFichaActividad" class="btn-ctrl" href="#" target="_blank" style="text-decoration:none;opacity:0.4;pointer-events:none"><i class="fa-solid fa-file-lines"></i> Ficha Actividad</a>
  </div>
</div>

<!-- HERRAMIENTAS -->
<div class="toolbar">
  <button type="button" class="btn-ctrl active" id="btnToggleEjes" title="Ocultar lista de ejes" aria-pressed="true">
    <i class="fa-solid fa-table-columns"></i> Ejes
  </button>
  <select id="ganttCategoria">
    <option value="Planificación">Planificación</option>
    <option value="Fortalecimiento">Fortalecimiento</option>
    <option value="Asistencia Técnica">Asistencia Técnica</option>
    <option value="Administrativo">Administrativo</option>
  </select>

  <!-- Vista -->
  <select id="ganttView">
    <option value="weeks">Semanas</option>
    <option value="months">Meses</option>
    <option value="days">Días</option>
  </select>

  <!-- Toggle solo hitos -->
  <button class="btn-ctrl" id="btnSoloHitos" onclick="toggleSoloHitos()">
    <i class="fa-solid fa-thumbtack"></i> Solo hitos
  </button>

  <!-- Zoom -->
  <div class="zoom-group">
    <button class="zoom-btn" onclick="changeZoom(-1)" title="Alejar"><i class="fa-solid fa-minus"></i></button>
    <span class="zoom-val" id="zoomVal">100%</span>
    <button class="zoom-btn" onclick="changeZoom(1)" title="Acercar"><i class="fa-solid fa-plus"></i></button>
  </div>

  <div class="spacer"></div>

  <!-- Navegación horizontal -->
  <div class="zoom-group">
    <button class="zoom-btn" title="Ir al inicio" onclick="scrollGantt('start')" style="font-size:13px"><i class="fa-solid fa-backward-step"></i></button>
    <button class="zoom-btn" title="Desplazar izquierda" onclick="scrollGantt('left')" style="font-size:13px"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="zoom-btn" title="Ir a hoy" onclick="scrollGantt('today')" style="font-size:13px;width:auto;padding:0 10px">Hoy</button>
    <button class="zoom-btn" title="Desplazar derecha" onclick="scrollGantt('right')" style="font-size:13px"><i class="fa-solid fa-chevron-right"></i></button>
    <button class="zoom-btn" title="Ir al final" onclick="scrollGantt('end')" style="font-size:13px"><i class="fa-solid fa-forward-step"></i></button>
  </div>
</div>

<!-- LAYOUT -->
<div class="gantt-wrap">
  <!-- Panel izquierdo ejes -->
  <div class="eje-panel" id="ejePanel">
    <div class="eje-panel-title">Ejes de trabajo</div>
    <div id="ejeList"></div>
  </div>

  <!-- Gantt — dos paneles independientes -->
  <div class="gantt-area">
    <!-- LEYENDA -->
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:#1e8e3e"></div> Completado</div>
      <div class="leg-item"><div class="leg-dot" style="background:#1a73e8"></div> En proceso</div>
      <div class="leg-item"><div class="leg-dot" style="background:#f9ab00"></div> Pendiente</div>
      <div class="leg-item"><div class="leg-dot" style="background:#d93025"></div> Bloqueado</div>
      <div class="leg-item"><i class="fa-solid fa-circle-exclamation" style="color:var(--red)"></i> Vencida</div>
      <div class="leg-item"><i class="fa-solid fa-triangle-exclamation" style="color:var(--amber)"></i> Por vencer</div>
    </div>

    <div class="gantt-body">
      <!-- Columna de labels: ancho fijo, nunca se toca -->
      <div class="label-panel">
        <div class="label-header">Actividades</div>
        <div class="label-rows" id="labelRows"></div>
      </div>
      <!-- Gantt data: scroll horizontal arriba, vertical sincronizado -->
      <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
        <div class="gantt-scroll-wrap" id="ganttScroll">
          <div id="ganttChart" style="position:relative"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DETALLE -->

<script>
const SUPABASE_URL  = 'https://lnjfnknciydxfgnyhfnf.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuamZua25jaXlkeGZnbnloZm5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNDcxMjQsImV4cCI6MjA4OTYyMzEyNH0.HRkZcoDpAbzO8U36Lo_5E1_i6aA7oWEX5lg4PO6SjlQ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let rawData   = [];
let ejesData  = [];
let ejeActual = '';
let soloHitos = false;
let zoomLevel = 100; // porcentaje
let baseZoom  = { days: 16, weeks: 40, months: 90 };

const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function fmtMonthEs(d) {
  const m = d.toLocaleString('es-PE', { month:'short' });
  return (m.charAt(0).toUpperCase() + m.slice(1)).replace('.','');
}

function estadoColor(e) {
  const n = (e||'').toLowerCase();
  if (n.includes('bloque'))  return 'var(--red)';
  if (n.includes('complet')) return 'var(--signal)';
  if (n.includes('proceso')) return 'var(--blue)';
  return 'var(--amber)';
}

function barClass(e) {
  const n = (e||'').toLowerCase();
  if (n.includes('bloque'))  return 'bar-blocked';
  if (n.includes('complet')) return 'bar-done';
  if (n.includes('proceso')) return 'bar-process';
  return 'bar-pending';
}

function pctAvg(rows) {
  const activas = rows.filter(r => !(r.estado||'').toLowerCase().includes('bloqueado'));
  if (!activas.length) return 0;
  return Math.round(activas.reduce((s,r)=>s+(r.avance||0),0)/activas.length);
}

// ── Zoom ──
function changeZoom(dir) {
  const steps = [50,75,100,125,150,175,200];
  const idx = steps.indexOf(zoomLevel);
  const newIdx = Math.max(0, Math.min(steps.length-1, idx + dir));
  zoomLevel = steps[newIdx];
  document.getElementById('zoomVal').textContent = zoomLevel + '%';
  renderGantt();
}

// ── Toggle solo hitos ──
function toggleSoloHitos() {
  soloHitos = !soloHitos;
  const btn = document.getElementById('btnSoloHitos');
  btn.classList.toggle('active', soloHitos);
  renderGantt();
}

// ── Cargar datos ──
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const [{ data: acts }, { data: ejes }] = await Promise.all([
    sb.from('actividades').select('*').order('id'),
    sb.from('ejes').select('*').order('nombre'),
  ]);

  rawData  = acts  || [];
  ejesData = ejes  || [];

  buildEjePanel();

  // Todo listo — ocultar loader y mostrar página
  const loader = document.getElementById('appLoaderGantt');
  if (loader) {
    loader.classList.add('fade-out');
    setTimeout(() => { loader.style.display = 'none'; }, 300);
  }
  document.body.style.opacity = '1';
  document.body.style.transition = 'opacity .2s ease';

  // Realtime
  sb.channel('gantt-cambios')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'actividades' }, async () => {
      const { data } = await sb.from('actividades').select('*').order('id');
      rawData = data || [];
      buildEjePanel();
      renderGantt();
    })
    .subscribe();
}

// ── Panel de ejes ──
function buildEjePanel() {
  const list = document.getElementById('ejeList');
  const cat = (document.getElementById('ganttCategoria')?.value || '').trim();
  const acts = [...new Set(rawData.filter(r=>r.subactividad).map(r=>(r.actividad_general||'').trim()))]
      .filter(Boolean)
      .filter(nombre => {
        if (!cat) return true;
        const eje = ejesData.find(e => e.nombre === nombre);
        return (eje?.tipo || 'Planificación') === cat;
      })
      .sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));

  // Si el eje actual no pertenece a la categoría filtrada, limpiar
  if (!acts.includes(ejeActual)) ejeActual = acts.length ? acts[0] : null;

  list.innerHTML = acts.map(a => {
    const rows = rawData.filter(r => r.actividad_general === a && r.subactividad);
    const pct  = pctAvg(rows);
    const isActive = a === ejeActual;
    return `<div class="eje-item ${isActive?'active':''}" onclick="selectEje('${esc(a).replace(/'/g,"\\'")}')">
      ${esc(a)}
      <div class="eje-pct" style="color:${isActive?'var(--accent)':'var(--muted)'}">${pct}%</div>
    </div>`;
  }).join('');

  // Actualizar doc buttons
  updateDocButtons(ejeActual);
  renderGantt();
}

window.selectEje = function(nombre) {
  ejeActual = nombre;
  buildEjePanel();
};

// ── Doc buttons ──
function updateDocButtons(actName) {
  const btnAM = document.getElementById('btnAyudaMemoria');
  const btnFA = document.getElementById('btnFichaActividad');
  const eje = ejesData.find(e => e.nombre === actName);
  const urlAM = eje?.url_ayuda || '';
  const urlFA = eje?.url_ficha || '';
  if (urlAM?.startsWith('http')) {
    btnAM.href = urlAM; btnAM.style.opacity='1'; btnAM.style.pointerEvents='';
  } else {
    btnAM.href = '#'; btnAM.style.opacity='0.4'; btnAM.style.pointerEvents='none';
  }
  if (urlFA?.startsWith('http')) {
    btnFA.href = urlFA; btnFA.style.opacity='1'; btnFA.style.pointerEvents='';
  } else {
    btnFA.href = '#'; btnFA.style.opacity='0.4'; btnFA.style.pointerEvents='none';
  }
}

// ── Render Gantt ──
function renderGantt() {
  const container = document.getElementById('ganttChart');
  const view = document.getElementById('ganttView').value;

  if (!ejeActual) {
    container.innerHTML = '<div class="empty-gantt">Selecciona un eje de trabajo</div>';
    document.getElementById('labelRows').innerHTML = '';
    return;
  }

  const data = rawData.filter(r => r.subactividad && (r.actividad_general||'').trim() === ejeActual);
  if (!data.length) {
    container.innerHTML = '<div class="empty-gantt">Sin actividades para este eje</div>';
    document.getElementById('labelRows').innerHTML = '';
    return;
  }

  const tasks = data.map(r => ({
    row: r, name: r.subactividad||'',
    hito: r.hito||'—', estado: r.estado||'Pendiente',
    pct: r.avance||0,
    start: r.fecha_inicio ? new Date(r.fecha_inicio+'T00:00:00') : null,
    end:   r.fecha_fin    ? new Date(r.fecha_fin   +'T00:00:00') : null,
  })).filter(t => t.start && t.end && !isNaN(t.start) && !isNaN(t.end));

  if (!tasks.length) {
    container.innerHTML = '<div class="empty-gantt">Sin fechas válidas para mostrar</div>';
    document.getElementById('labelRows').innerHTML = '';
    return;
  }

  const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
  const daysBetween = (a,b) => Math.round((startOfDay(b)-startOfDay(a))/86400000);

  const allDates = tasks.flatMap(t=>[t.start,t.end]);
  let minD = startOfDay(new Date(Math.min(...allDates)));
  let maxD = startOfDay(new Date(Math.max(...allDates)));

  if (view==='days') { minD.setDate(minD.getDate()-7); maxD.setDate(maxD.getDate()+7); }
  else if (view==='weeks') { minD.setDate(minD.getDate()-14); maxD.setDate(maxD.getDate()+14); }
  else { minD.setMonth(minD.getMonth()-1); maxD.setMonth(maxD.getMonth()+1); }

  const totalDays   = daysBetween(minD,maxD)+1;
  const totalWeeks  = Math.ceil(totalDays/7);
  const totalMonths = (maxD.getFullYear()-minD.getFullYear())*12 + maxD.getMonth()-minD.getMonth()+1;

  let colCount;
  if (view==='days') colCount=totalDays;
  else if (view==='weeks') colCount=totalWeeks;
  else colCount=totalMonths;

  const base = baseZoom[view];
  const zoom = Math.round(base * zoomLevel / 100);
  const labelW = 340;

  // Ticks y spans
  const ticks=[], monthSpans=[];
  if (view==='days') {
    let curM=null, mStart=1;
    for (let i=0;i<totalDays;i++) {
      const d=new Date(minD.getTime()+i*86400000);
      ticks.push({col:i+2, label:d.getDate(), weekend: d.getDay()===0||d.getDay()===6, altMonth: Math.floor(i/7)%2===0});
      const mk=d.getFullYear()+'-'+d.getMonth();
      if (mk!==curM) {
        if (curM!==null) monthSpans.push({startCol:mStart+1,span:i-mStart+1,label:fmtMonthEs(new Date(minD.getTime()+(mStart-1)*86400000))+' '+new Date(minD.getTime()+(mStart-1)*86400000).getFullYear()});
        curM=mk; mStart=i+1;
      }
    }
    monthSpans.push({startCol:mStart+1,span:totalDays-mStart+1,label:fmtMonthEs(new Date(minD.getTime()+(mStart-1)*86400000))+' '+new Date(minD.getTime()+(mStart-1)*86400000).getFullYear()});
  } else if (view==='weeks') {
    for (let i=0;i<totalWeeks;i++) {
      const d=new Date(minD.getTime()+i*7*86400000);
      ticks.push({col:i+2,label:d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0'),altMonth:i%2===0});
    }
    let curM=null,mStart=1;
    ticks.forEach((t,i)=>{
      const d=new Date(minD.getTime()+i*7*86400000);
      const mk=d.getFullYear()+'-'+d.getMonth();
      if(mk!==curM){
        if(curM!==null){const prev=new Date(minD.getTime()+(mStart-1)*7*86400000);monthSpans.push({startCol:mStart+1,span:i-mStart+1,label:fmtMonthEs(prev)+' '+prev.getFullYear()});}
        curM=mk;mStart=i+1;
      }
    });
    const last=new Date(minD.getTime()+(mStart-1)*7*86400000);
    monthSpans.push({startCol:mStart+1,span:totalWeeks-mStart+1,label:fmtMonthEs(last)+' '+last.getFullYear()});
  } else {
    for (let i=0;i<totalMonths;i++) {
      const d=new Date(minD.getFullYear(),minD.getMonth()+i,1);
      ticks.push({col:i+2,label:fmtMonthEs(d),altMonth:i%2===0});
    }
    let curY=null,mStart=1;
    ticks.forEach((t,i)=>{
      const d=new Date(minD.getFullYear(),minD.getMonth()+i,1);
      const yk=d.getFullYear();
      if(yk!==curY){if(curY!==null)monthSpans.push({startCol:mStart+1,span:i-mStart+1,label:String(curY)});curY=yk;mStart=i+1;}
    });
    monthSpans.push({startCol:mStart+1,span:totalMonths-mStart+1,label:String(new Date(minD.getFullYear(),minD.getMonth()+(mStart-1),1).getFullYear())});
  }

  const getStartCol = t => {
    if (view==='days') return 2+daysBetween(minD,t.start);
    if (view==='weeks') return 2+Math.floor(daysBetween(minD,t.start)/7);
    return 2+(t.start.getFullYear()-minD.getFullYear())*12+t.start.getMonth()-minD.getMonth();
  };
  const getDur = t => {
    if (view==='days') return Math.max(1,daysBetween(t.start,t.end)+1);
    if (view==='weeks') return Math.max(1,Math.ceil(daysBetween(t.start,t.end)/7));
    return Math.max(1,(t.end.getFullYear()-t.start.getFullYear())*12+t.end.getMonth()-t.start.getMonth()+1);
  };

  // Agrupar por hito
  const byHito=new Map();
  tasks.forEach(t=>{const k=t.hito||'—';if(!byHito.has(k))byHito.set(k,[]);byHito.get(k).push(t);});
  const hitoNum=h=>{const m=(h||'').match(/(\d+)/);return m?parseInt(m[1]):9999;};
  const sortedHitos=[...byHito.keys()].sort((a,b)=>hitoNum(a)-hitoNum(b)||a.localeCompare(b,'es',{sensitivity:'base'}));
  const actNum=s=>{const m=(s||'').match(/^[\s(]*(\d+)\.(\d+)/);return m?parseInt(m[1])*1000+parseInt(m[2]):(s||'').match(/^[\s(]*(\d+)/)?parseInt((s||'').match(/^[\s(]*(\d+)/)[1])*1000:9999000;};

  let rows=[];
  sortedHitos.forEach(h=>{
    // Calcular rango del hito para la barra resumen
    const hTasks = byHito.get(h).filter(t=>t.start&&t.end);
    let hitoStart=null, hitoEnd=null, hitoPct=0;
    if (hTasks.length) {
      hitoStart = new Date(Math.min(...hTasks.map(t=>t.start)));
      hitoEnd   = new Date(Math.max(...hTasks.map(t=>t.end)));
      hitoPct   = Math.round(hTasks.reduce((s,t)=>s+t.pct,0)/hTasks.length);
    }
    rows.push({type:'group', label:h, hitoStart, hitoEnd, hitoPct, tasks: hTasks});
    if (!soloHitos) {
      byHito.get(h).sort((a,b)=>actNum(a.name)-actNum(b.name))
        .forEach(t=>rows.push({type:'task',task:t}));
    }
  });

  // Hoy
  const today=startOfDay(new Date());
  const todayDays=daysBetween(minD,today);
  let todayCol=null;
  if (view==='days') todayCol=todayDays;
  else if (view==='weeks') todayCol=Math.floor(todayDays/7);
  else todayCol=(today.getFullYear()-minD.getFullYear())*12+today.getMonth()-minD.getMonth();
  const hasToday=todayCol>=1&&todayCol<colCount-1;

  const rowH = soloHitos ? 36 : 32;
  const headerH = 28;

  // ── TABLA DE LABELS (panel fijo izquierdo) ──
  let labelHtml = `<table class="label-table">`;
  rows.forEach(row => {
    const isGroup = row.type === 'group';
    const cls = isGroup ? 'group-row' : 'task-row';
    const labelText = isGroup ? row.label : (row.task?.name || '');
    const clickAttr = !isGroup ? `onclick="showDetail(${row.task?.row?.id})"` : '';
    labelHtml += `<tr><td class="label-cell ${cls}" ${clickAttr} title="${esc(labelText)}" style="height:${rowH}px">${esc(labelText)}</td></tr>`;
  });
  labelHtml += `</table>`;
  document.getElementById('labelRows').innerHTML = labelHtml;

  // ── TABLA DEL GANTT (solo datos, sin columna label) ──
  let html = `<table class="ganttGrid">`;
  html += `<colgroup>${Array(colCount).fill(`<col style="width:${zoom}px"/>`).join('')}</colgroup>`;

  // THEAD: fila 1 meses, fila 2 ticks
  html += `<thead><tr>`;
  monthSpans.forEach(s => {
    html += `<th class="ganttMonth" colspan="${s.span}" style="height:${headerH}px;min-width:${zoom*s.span}px">${esc(String(s.label))}</th>`;
  });
  html += `</tr><tr>`;
  ticks.forEach(t => {
    html += `<th class="ganttTick" style="width:${zoom}px;min-width:${zoom}px;height:${headerH}px">${esc(String(t.label))}</th>`;
  });
  html += `</tr></thead><tbody>`;

  // TBODY: solo celdas de datos
  rows.forEach(row => {
    const isGroup = row.type === 'group';
    const cls = isGroup ? 'group-row' : 'task-row';
    html += `<tr>`;
    for (let c = 0; c < colCount; c++) {
      const col = c + 2;
      const isWeekend = view === 'days' && ticks[c]?.weekend;
      const isAltMonth = ticks[c]?.altMonth;
      html += `<td class="gantt-cell ${cls} ${isWeekend?'weekend':''} ${isAltMonth?'alt-month':''}" style="height:${rowH}px;width:${zoom}px;min-width:${zoom}px;position:relative">`;

      if (isGroup && soloHitos && row.hitoStart && row.hitoEnd) {
        const sc = getStartCol({start:row.hitoStart});
        const dur = getDur({start:row.hitoStart,end:row.hitoEnd});
        if (col===sc) {
          const w = (dur*zoom)-4;
          html += `<div class="gbar-wrap"><div class="gbar hito-mode" style="left:2px;width:${w}px;background:#1967d2" title="${esc(row.label)}">${row.hitoPct}% · ${esc(row.label)}</div></div>`;
        }
      } else if (!isGroup) {
        const t = row.task;
        const sc = getStartCol(t);
        const dur = getDur(t);
        if (col===sc) {
          const w = dur*zoom-4;
          const today2 = startOfDay(new Date());
          const esBloq = (t.estado||'').toLowerCase().includes('bloqueado');
          const isVencida = !esBloq && t.end<today2 && t.pct<100;
          const isPorVencer = !esBloq && !isVencida && t.end>=today2 && daysBetween(today2,t.end)<=7 && t.pct<100;
          const alertBorder = isVencida ? 'box-shadow:0 0 0 1px #fff,0 0 0 3px #d93025;' : isPorVencer ? 'box-shadow:0 0 0 1px #fff,0 0 0 3px #e37400;' : '';
          const alertBadge = isVencida
            ? `<div style="position:absolute;top:-5px;left:-3px;font-size:12px;line-height:1;pointer-events:none;z-index:5;background:#fff;border-radius:50%;padding:1px"><i class="fa-solid fa-circle-exclamation" style="color:var(--red)"></i></div>`
            : isPorVencer
            ? `<div style="position:absolute;top:-5px;left:-3px;font-size:12px;line-height:1;pointer-events:none;z-index:5;background:#fff;border-radius:50%;padding:1px"><i class="fa-solid fa-triangle-exclamation" style="color:var(--amber)"></i></div>`
            : '';
          html += `<div class="gbar-wrap" style="overflow:visible">${alertBadge}<div class="gbar ${barClass(t.estado)}" style="left:2px;width:${w}px;cursor:pointer;${alertBorder}" title="${esc(t.name)} — ${t.estado} ${t.pct}%" onclick="showDetail(${t.row.id})">${t.pct}% · ${esc(t.name)}</div></div>`;
        }
      }
      html += `</td>`;
    }
    html += `</tr>`;
  });

  html += `</tbody></table>`;
  container.innerHTML = html;

  // Overlay línea de hoy
  if (hasToday) {
    const overlayLeft = (todayCol * zoom) + (zoom / 2) - 1;
    const overlay = document.createElement('div');
    overlay.className = 'today-overlay';
    overlay.style.left = overlayLeft + 'px';
    container.style.position = 'relative';
    container.appendChild(overlay);
  }

  // Sincronizar scroll vertical: labelRows es el master, ganttChart sigue
  const ganttScroll = document.getElementById('ganttScroll');
  const labelRowsEl = document.getElementById('labelRows');
  
  // Hacer label-rows scrollable verticalmente y ganttScroll también
  labelRowsEl.style.overflowY = 'auto';
  ganttScroll.style.overflowY = 'auto';
  
  let syncing = false;
  labelRowsEl.onscroll = () => {
    if (syncing) return; syncing = true;
    ganttScroll.scrollTop = labelRowsEl.scrollTop;
    syncing = false;
  };
  ganttScroll.onscroll = () => {
    if (syncing) return; syncing = true;
    labelRowsEl.scrollTop = ganttScroll.scrollTop;
    syncing = false;
  };

  // Auto-scroll a hoy
  if (hasToday) {
    const scrollX = Math.max(0, todayCol*zoom - 300);
    setTimeout(() => ganttScroll.scrollLeft = scrollX, 50);
  }
}

document.getElementById('ganttView').addEventListener('change', renderGantt);

// ── Navegación horizontal del Gantt ──
function scrollGantt(dir) {
  const el = document.getElementById('ganttScroll');
  if (!el) return;
  const step = 300;
  if (dir === 'left')  el.scrollLeft -= step;
  if (dir === 'right') el.scrollLeft += step;
  if (dir === 'start') el.scrollLeft = 0;
  if (dir === 'end')   el.scrollLeft = el.scrollWidth;
  if (dir === 'today') {
    // Buscar la línea de hoy y scrollear hasta ella
    const overlay = el.querySelector('.today-overlay');
    if (overlay) {
      const left = parseInt(overlay.style.left) || 0;
      el.scrollLeft = Math.max(0, left - 300);
    }
  }
}

window.showDetail = function(id) {

  const modal = document.getElementById('detailModal');
  const content = document.getElementById('detailContent');

  const estadoColor = e => {
    const n=(e||'').toLowerCase();
    if(n.includes('bloque')) return '#c5221f';
    if(n.includes('complet')) return '#137333';
    if(n.includes('proceso')) return '#1967d2';
    return '#b06000';
  };

  const today = new Date(); today.setHours(0,0,0,0);
  const end = row.fecha_fin ? new Date(row.fecha_fin+'T00:00:00') : null;

  const isVencida = !esBloq2 && end && end < today && (row.avance||0) < 100;

  content.innerHTML = `

      ${isVencida ? '<div style="margin-top:8px;font-size:13px;color:#d93025;font-weight:500"><i class="fa-solid fa-circle-exclamation"></i> Actividad vencida</div>' : ''}
      ${isPorVencer ? '<div style="margin-top:8px;font-size:13px;color:#b06000;font-weight:500"><i class="fa-solid fa-triangle-exclamation"></i> Por vencer esta semana</div>' : ''}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
      <span style="padding:3px 10px;border-radius:8px;background:${estadoColor(row.estado)}1f;color:${estadoColor(row.estado)};font-size:12px;font-weight:500">${esc(row.estado||'Pendiente')}</span>
      <span style="padding:3px 10px;border-radius:8px;background:#f1f3f4;color:#3c4043;font-size:12px;font-weight:500">${row.avance||0}% avance</span>
      ${row.prioridad ? `<span style="padding:3px 10px;border-radius:8px;background:#f1f3f4;color:#3c4043;font-size:12px;font-weight:500">${esc(row.prioridad)}</span>` : ''}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;font-size:14px">
      ${row.responsable ? `<div><div style="font-size:12px;font-weight:500;color:#5f6368;margin-bottom:2px">Responsable</div><div style="color:#202124">${esc(row.responsable)}</div></div>` : ''}
      ${row.equipo_tecnico ? `<div><div style="font-size:12px;font-weight:500;color:#5f6368;margin-bottom:2px">Equipo</div><div style="color:#202124">${esc(row.equipo_tecnico)}</div></div>` : ''}
      ${row.ciudad ? `<div><div style="font-size:12px;font-weight:500;color:#5f6368;margin-bottom:2px">Ciudad</div><div style="color:#202124">${esc(row.ciudad)}</div></div>` : ''}
      ${row.fecha_inicio ? `<div><div style="font-size:12px;font-weight:500;color:#5f6368;margin-bottom:2px">Fecha inicio</div><div style="color:#202124">${row.fecha_inicio}</div></div>` : ''}
      ${row.fecha_fin ? `<div><div style="font-size:12px;font-weight:500;color:#5f6368;margin-bottom:2px">Fecha fin</div><div style="color:#202124">${row.fecha_fin}</div></div>` : ''}
      ${row.producto ? `<div style="grid-column:1/-1"><div style="font-size:12px;font-weight:500;color:#5f6368;margin-bottom:2px">Producto</div><div style="color:#202124">${esc(row.producto)}</div></div>` : ''}
      ${row.comentarios ? `<div style="grid-column:1/-1"><div style="font-size:12px;font-weight:500;color:#5f6368;margin-bottom:2px">Comentarios</div><div style="color:#202124;white-space:pre-line">${esc(row.comentarios)}</div></div>` : ''}
    </div>
    ${row.evidencia ? `<div style="margin-top:16px"><a href="${esc(row.evidencia)}" target="_blank" style="color:var(--accent);font-size:14px;font-weight:500;text-decoration:none"><i class="fa-solid fa-link"></i> Ver evidencia</a></div>` : ''}
  `;

  modal.style.display = 'flex';
};

window.closeDetail = function() {
  document.getElementById('detailModal').style.display = 'none';
};

// Cerrar con ESC o click fuera
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetail(); });
document.getElementById('detailModal').addEventListener('click', e => {
  if(e.target === document.getElementById('detailModal')) closeDetail();
});
</script>
<script>
  // Mostrar / ocultar la lista de ejes (independiente del resto del código)
  (function () {
    var btn = document.getElementById('btnToggleEjes');
    function aplicar(oculta) {
      document.body.classList.toggle('ejes-ocultos', oculta);
      btn.classList.toggle('active', !oculta);
      btn.setAttribute('aria-pressed', oculta ? 'false' : 'true');
      btn.title = oculta ? 'Mostrar lista de ejes' : 'Ocultar lista de ejes';
    }
    var guardado = null;
    try { guardado = localStorage.getItem('dfpm-gantt-ejes'); } catch (e) {}
    aplicar(guardado === 'oculta');
    btn.addEventListener('click', function () {
      var oculta = !document.body.classList.contains('ejes-ocultos');
      aplicar(oculta);
      try { localStorage.setItem('dfpm-gantt-ejes', oculta ? 'oculta' : 'visible'); } catch (e) {}
    });
  })();
</script>
</body>
</html>
